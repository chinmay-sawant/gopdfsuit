name: setup-validators
description: Install veraPDF plus avalpdf plus PDF fonts for compliance gates (row 5.7 shared action)

runs:
  using: composite
  steps:
    - name: Install system dependencies
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y openjdk-11-jre-headless unzip curl \
          fonts-liberation fonts-dejavu-core fonts-noto-core
    - name: Install PDF validators
      shell: bash
      run: make install-pdf-validators
